name: Apply Cloudflare config

# NEVER add `pull_request` to this workflow, and never relax the branch filter.
#
# This job holds a zone-scoped Cloudflare token (deploy.yml holds the other
# credential, an SSH key into the origin), which makes it one of the two that
# have to be paranoid. The repository is public: a pull_request trigger runs a
# fork's code, and a fork's code with this token could rewrite the cache rules of
# a live domain. GitHub does not expose secrets to fork PRs by default, but that
# default is a setting, and this comment is here so nobody changes it casually.
#
# The token must be zone-scoped (Cache Rules:Edit, Zone Settings:Edit on
# latam-tools.com.br only), never a Global API Key.
#
# This workflow is NOT fossil, however much of it reads that way after the
# grey-cloud cutover. ragassets itself no longer passes through Cloudflare, so
# the cache rules here cannot match it — but zone-settings.json is zone-wide and
# still governs latam-market, short, simulador-latam-ro and latam-social, and the
# cache rules are kept rather than deleted so that re-proxying this host is one
# click. Deleting either would break the siblings or throw away the rollback.
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "tools/apply-cloudflare.mjs"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

# Two overlapping runs would race to PUT different rulesets, and the phase
# entrypoint is wholesale — the loser silently wins.
concurrency:
  group: cloudflare-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Runs without credentials and fails if any rule is missing its http.host
      # scope. That check matters: this zone also serves latam-market, short,
      # simulador-latam-ro and latam-social, and an unscoped rule would change
      # caching for all of them.
      - name: Validate the plan
        run: node tools/apply-cloudflare.mjs --dry-run

      - name: Apply
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: node tools/apply-cloudflare.mjs

      # Proves the rules do what they claim rather than merely that the API
      # accepted them.
      #
      # It is a no-op today and expected to stay one: `assets` was grey-clouded
      # on 2026-09-09, so its traffic never reaches Cloudflare and no rule here
      # can match it. The step is kept rather than deleted because it is exactly
      # the check that has to pass if the record is ever flipped back to orange,
      # and rewriting it from memory at that point is how a silent cache
      # regression ships. A missing CF-Cache-Status is therefore the correct
      # answer, not a skip waiting on something.
      - name: Verify /image is cacheable
        env:
          HOST: https://assets.latam-tools.com.br
        run: |
          url="$HOST/image?job=1002&action=0&cachecheck=$(date +%s)"
          first=$(curl -sS -o /dev/null -D - "$url" | tr -d '\r' | awk -F': ' '/^cf-cache-status/{print $2}')
          second=$(curl -sS -o /dev/null -D - "$url" | tr -d '\r' | awk -F': ' '/^cf-cache-status/{print $2}')
          echo "cf-cache-status: $first then $second"
          if [ -z "$first" ]; then
            echo "no CF-Cache-Status header — expected: this host is grey-clouded (DNS only),"
            echo "so nothing passes through Cloudflare. This check means something again only"
            echo "if the assets record is flipped back to orange."
            exit 0
          fi
          [ "$second" = "HIT" ] || { echo "expected HIT on the second request, got '$second'"; exit 1; }
          echo "renders are edge-cached"
