name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two overlapping runs would race to activate different asset manifests.
# Serialising is free. Same group name as the sibling repos.
concurrency:
  group: site-deploy
  cancel-in-progress: false

env:
  VERIFY_HOST: https://assets.latam-tools.com.br

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Job-scoped so every rclone step sees them. Repeating the block per step is
    # how a renamed or added variable gets missed in one copy, and the failure
    # surfaces as a mid-run 403 that reads like a credentials problem.
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v5

      # The wrangler environment to deploy comes from .github/deploy-env, not
      # from a literal here, because update-assets.yml deploys too. Two copies
      # would mean that at cutover someone flips this one and the patch pipeline
      # keeps shipping every client update to staging — production silently stops
      # receiving new sprites, with both workflows green.
      #
      # "production" means the TOP-LEVEL config, which is why it maps to no --env
      # flag at all. That config owns the live custom domain; a named
      # env.production would be a second Worker under a different name competing
      # for the same hostname.
      - name: Resolve the deploy target
        run: |
          target="$(cat .github/deploy-env)"
          echo "WRANGLER_ENV=$target" >> "$GITHUB_ENV"
          if [ "$target" = "production" ]; then
            echo "WRANGLER_ENV_FLAG=" >> "$GITHUB_ENV"
          else
            echo "WRANGLER_ENV_FLAG=--env $target" >> "$GITHUB_ENV"
          fi

      # 22, not 20: wrangler refuses to run on anything below v22, and it is the
      # version that actually publishes. Matches the local toolchain.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: gateway/go.sum

      # The extractor's parsers are pure and need neither a GRF nor resources/,
      # so they run here in full.
      - name: Test the extractor
        run: node --test extract-grf.test.mjs

      # Most Go tests skip without resources/ (16 GB, gitignored) — but not the
      # golden renders. Those run against a committed fixture pack precisely so
      # CI cannot pass vacuously on the one thing that guards the renderer.
      - name: Test the gateway
        working-directory: gateway
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Check formatting
        working-directory: gateway
        run: |
          unformatted=$(gofmt -l . | grep -v '_gen.go' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      # Needed before the build now, because resolving the asset epoch reads R2.
      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      # This deploy ships code, not assets, so it must NOT invent a new asset
      # epoch — doing that discarded the cached sprites along with the cached
      # renders, and the first traffic after any deploy was a burst of fully cold
      # renders at 470-1050 ms with 8 of 60 failing. The current value is whatever
      # update-assets.yml last stamped into the bucket; read it back and reuse it.
      #
      # A missing or empty marker falls back to a fresh timestamp rather than to a
      # constant. That is the safe direction and the only one: reusing a value we
      # are not sure of would serve stale sprites indefinitely, while inventing
      # one costs a cold cache for a few minutes.
      #
      # It then seeds the marker, so this path runs once rather than on every
      # deploy until the next client patch happens to write one. Seeding only when
      # absent is what keeps it safe — update-assets.yml overwrites unconditionally
      # whenever it uploads, so this can never pin the epoch across an asset change.
      - name: Resolve the asset epoch
        run: |
          rclone cat r2:ragassets/manifest/epoch --s3-no-check-bucket > epoch.txt 2>/dev/null || true
          if [ -s epoch.txt ]; then
            epoch="$(tr -d '[:space:]' < epoch.txt)"
            echo "reusing asset epoch $epoch — the resource cache survives this deploy"
          else
            epoch="$(date +%s)"
            echo "no asset epoch in the bucket; seeding $epoch (this deploy drops the resource cache)"
            printf '%s' "$epoch" > epoch.txt
            rclone copyto epoch.txt r2:ragassets/manifest/epoch --s3-no-check-bucket
          fi
          echo "ASSET_EPOCH=$epoch" >> "$GITHUB_ENV"

      # Cross-compiles the renderer to wasm and writes the JS shim beside it.
      # Fails the build if the bundle passes the 10 MB gzip limit.
      #
      # RENDER_EPOCH is left to build-worker.sh, which appends the commit sha to
      # ASSET_EPOCH: the renders must be invalidated by a code deploy even though
      # the assets must not.
      - name: Build the Worker
        run: ./tools/build-worker.sh

      # ./public is 298 MB across 39,241 files and only changes when a client
      # update ships new static assets. Restoring it turns the hydrate below into
      # a checksum reconcile — a bucket listing and almost no transfer — rather
      # than a full re-download on every run. rclone still runs either way, so a
      # stale cache cannot deploy stale assets.
      - name: Cache the static assets
        uses: actions/cache@v4
        with:
          path: public
          key: static-assets-${{ github.run_id }}
          restore-keys: static-assets-

      # CI has no extracted client, so ./public is rebuilt from the copy in R2.
      # wrangler needs it present: deploying with `assets` configured and the
      # directory missing reads as "all 39,241 assets deleted", which would take
      # the icons offline. hydrate-assets.sh refuses to continue on a short
      # download for exactly that reason.
      - name: Hydrate the static assets
        run: ./tools/hydrate-assets.sh

      # Deliberately NOT cloudflare/wrangler-action: it installs its own wrangler
      # rather than the repo's, and the sibling project hit an ERESOLVE doing so.
      # wrangler reads both secrets from the environment.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy $WRANGLER_ENV_FLAG

      # A deploy that serves the wrong thing is worse than one that fails.
      #
      # The icon check is the important one. Icons are 69% of traffic and are
      # only free because they come from Static Assets rather than the Worker;
      # if run_worker_first were ever set to `true`, or the assets block dropped,
      # they would still return 200 while quietly moving onto the Worker request
      # budget and losing their cache policy. Asserting the immutable header
      # catches both, and it is the one regression that actually costs money.
      - name: Verify
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$VERIFY_HOST/healthz" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "healthz never came up"; exit 1; }
          echo "healthz ok"

          curl -sf "$VERIFY_HOST/image?job=1&head=1&action=0&frame=0&enableShadow=false" \
            -o /tmp/render.png
          head -c 8 /tmp/render.png | grep -q $'\x89PNG' || { echo "not a PNG"; exit 1; }
          size=$(wc -c < /tmp/render.png)
          [ "$size" -gt 500 ] || { echo "render suspiciously small: $size bytes"; exit 1; }
          echo "render ok ($size bytes)"

          cc=$(curl -sI "$VERIFY_HOST/icons/item/501.png" \
               | tr -d '\r' | grep -i '^cache-control:' || true)
          echo "icon $cc"
          echo "$cc" | grep -qi 'immutable' || {
            echo "icons lost their immutable cache policy — check the assets"
            echo "block and that run_worker_first is still an ARRAY, not true."
            exit 1
          }
